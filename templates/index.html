<!doctype html>
<html lang="en"> 
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stress Check</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f3f6fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 620px);
            padding: 36px;
            border: 1px solid #e3e8f1;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 18px 50px #26385b14;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #5368d8;
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 5vw, 2.4rem);
            letter-spacing: -.04em;
        }

        .intro {
            margin: 12px 0 28px;
            color: #647087;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: .95rem;
            font-weight: 650;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 180px;
            resize: vertical;
            padding: 15px;
            border: 1px solid #cfd7e6;
            border-radius: 12px;
            color: inherit;
            font: inherit;
            line-height: 1.5;
        }

        textarea:focus {
            border-color: #5368d8;
            outline: 3px solid #5368d826;
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 14px 18px;
            border: 0;
            border-radius: 12px;
            background: #5368d8;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #4155c3;
        }

        button:disabled {
            cursor: wait;
            opacity: .7;
        }

        #result {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 12px;
            background: #f2f4ff;
            color: #293a91;
            line-height: 1.5;
        }

        #result[hidden] {
            display: none;
        }

        #result.error {
            background: #fff2f0;
            color: #a52a21;
        }

        @media (max-width: 480px) {
            main {
                padding: 26px 20px;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Model testing</p>
        <h1>Stress Check</h1>
        <p class="intro">Enter a sentence or a short passage to see the model’s prediction.</p>

        <form id="prediction-form" action="{{ url_for('predict') }}" method="post">
            <label for="text">Text to analyze</label>
            <textarea id="text" name="text" placeholder="Write or paste some text here..." required></textarea>
            <button id="submit-button" type="submit">Analyze text</button>
        </form>

        <div id="result" role="status" aria-live="polite" hidden></div>
    </main>

    <script>
        const form = document.getElementById("prediction-form");
        const result = document.getElementById("result");
        const submitButton = document.getElementById("submit-button");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            result.hidden = true;
            result.classList.remove("error");
            submitButton.disabled = true;
            submitButton.textContent = "Analyzing...";

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    body: new FormData(form)
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "The prediction could not be completed.");
                }

                result.textContent = `Prediction: ${data.prediction}`;
                result.classList.remove("error");
            } catch (error) {
                result.textContent = error.message || "Unable to reach the prediction service.";
                result.classList.add("error");
            } finally {
                result.hidden = false;
                submitButton.disabled = false;
                submitButton.textContent = "Analyze text";
            }
        });
    </script>
</body>
</html>
